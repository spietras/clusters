# Create HTTP ingress route for flux
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flux
spec:
  entryPoints:
    # Use entrypoint for HTTPS traffic
    - https
  routes:
    # Enable OIDC when requested by the header
    - match: >-
        Host(`flux.k8s.spietras.dev`) &&
        Header(`X-Traefik-Middleware-OIDC`, `true`)
      kind: Rule
      middlewares:
        # Use OIDC middleware
        - name: oidc
          namespace: traefik
      services:
        # Route traffic to the flux-operator service
        - name: flux-operator
          # This is the name of the port in the service
          port: http-web
    # Bypass OIDC by default
    - match: Host(`flux.k8s.spietras.dev`)
      kind: Rule
      services:
        # Route traffic to the flux-operator service
        - name: flux-operator
          # This is the name of the port in the service
          port: http-web
