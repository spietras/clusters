# Create lotus Helm release
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lotus
spec:
  chart:
    spec:
      # Use this chart from the repository
      chart: lotus
      # Pin version to major
      version: "0.x"
      # Use this Helm repository
      sourceRef:
        kind: HelmRepository
        name: radio-aktywne
  # This key always needs to be here for patching to work
  postRenderers: []
  values:
    lotus:
      urls:
        orchid:
          host: orchid.k8s.spietras.dev
          port: null
          scheme: https
        sunflower:
          host: sunflower.k8s.spietras.dev
          port: null
          scheme: https
